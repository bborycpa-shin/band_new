name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://skbfyrzjdvwxzstuimua.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_PwW9ykf-5CdPuOL-CsIs_A_ihMJfDMv
          VITE_SUPABASE_AUDIO_BUCKET: songs
          VITE_SUPABASE_SPLIT_BUCKET: split-tracks
          VITE_SUPABASE_SCORE_BUCKET: sheets
          VITE_SUPABASE_ALBUM_BUCKET: photos

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
